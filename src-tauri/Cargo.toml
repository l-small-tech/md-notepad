[package]
name = "md-notepad"
version = "0.7.3"
description = "A minimal, fast, cross-platform markdown notepad with Notepad-style ephemeral tabs."
license = "GPL-3.0-only"
edition = "2021"

# The lib name is distinct from the bin name so Windows builds don't clash.
[lib]
name = "md_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# The SYSTEM clipboard. WebKitGTK gates navigator.clipboard.readText() behind a
# permission a packaged app cannot grant itself, so terminal paste needs this.
tauri-plugin-clipboard-manager = "2"

# Windows-only: the on-device Windows.Media.Ocr engine behind the whiteboard
# scan's text recognition, and the shell's virtual-desktop query (src/vdesk.rs).
# The `windows` crate is already in the tree via tauri/wry — this direct
# dependency only turns on the namespaces those two use.
[target.'cfg(target_os = "windows")'.dependencies]
# The persistent user/machine PATH from the registry (shell.rs `search_path`):
# what a NEW console would see, which a running process's environment snapshot
# does not. Already in the dependency graph via tauri.
winreg = "0.55"
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
  # SendInput (src/commands/voice_typing.rs): Win+H starts Windows voice typing.
  "Win32_UI_Input_KeyboardAndMouse",
  # IVirtualDesktopManager (src/vdesk.rs): which virtual desktop a window is on,
  # so the single-instance handoff never drags the user across desktops.
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

# Desktop-only plugins. These crates either don't compile for mobile
# (single-instance) or have no meaning there (window geometry, the
# self-updater, process restart/exit). Keep them out of the Android/iOS
# dependency graph entirely; lib.rs gates their registration on #[cfg(desktop)].
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The pty behind terminal tabs. Android has no fork/exec of a login shell, so
# this stays out of the mobile dependency graph entirely; commands/mod.rs and
# lib.rs gate the module and its command registrations on #[cfg(desktop)].
portable-pty = "0.9"
# Workspace file-watching (explorer auto-refresh). Desktop-only: SAF trees on
# Android have no inotify-style API, so mobile keeps the manual refresh button.
notify = "8"
notify-debouncer-mini = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Offline voice-note transcription (commands/whisper): whisper.cpp through
# whisper-rs, CPU only. Building it needs CMake and libclang (bindgen) — see
# README.md "Build notes". The model files are downloaded on demand with
# reqwest (already in the tree via the updater; `stream` lets a 1.5 GB file
# flow to disk chunk by chunk) and verified with sha2 against pinned digests.
whisper-rs = { version = "0.16", features = ["log_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# The same rustls + ring pairing the updater uses; `rustls-no-provider` means
# a process-wide provider must be installed before a client is built, which
# commands/whisper/models.rs does (the updater only does so when IT runs).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
futures-util = "0.3"
log = "0.4"

# WebKitGTK's own settings object (commands/webview.rs flips its
# enable-smooth-scrolling). Same crate+version wry already pulls in — this
# adds no new code to the build, only visibility.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Android-only. Native Context APIs Tauri's path API can't resolve (the
# app-specific EXTERNAL files dir, content:// reads, incoming intents) live in a
# local mobile plugin whose Kotlin holds the Activity/Context — pure-Rust JNI
# can't reach the Context in Tauri (ndk-context is unpopulated). See
# plugins/tauri-plugin-androidfs.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-androidfs = { path = "plugins/tauri-plugin-androidfs" }
