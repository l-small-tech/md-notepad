# pnpm settings (single-package repo, not a monorepo).
# pnpm blocks dependency postinstall scripts by default; these three need
# theirs (esbuild installs its platform binary; edgedriver/geckodriver
# download the WebDriver binaries the wdio e2e stack expects).
allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
